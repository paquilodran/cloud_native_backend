server:
  port: 8080

spring:
  application:
    name: pedidos360-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        auto-startup: ${RABBITMQ_AUTO_STARTUP:true}
        retry:
          enabled: true
          initial-interval: 1000ms
          multiplier: 2.0
          max-attempts: 3
        default-requeue-rejected: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: pedidos-default-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
    listener:
      auto-startup: ${KAFKA_AUTO_STARTUP:true}
      concurrency: 3
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

azure:
  activedirectory:
    tenant-id: ${AZURE_TENANT_ID:00000000-0000-0000-0000-000000000000}
    client-id: ${AZURE_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}
    app-id-uri: ${AZURE_API_APP_ID_URI:api://00000000-0000-0000-0000-000000000000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  kafka:
    topics:
      analytics: ${KAFKA_TOPIC_ANALYTICS:tcg.analytics.stream}
      audit: ${KAFKA_TOPIC_AUDIT:tcg.audit.stream}
    partitions: 3
    replication-factor: 3

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:pedidos360;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360_db}
    username: ${DB_USERNAME:pedidos}
    password: ${DB_PASSWORD:pedidos}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
