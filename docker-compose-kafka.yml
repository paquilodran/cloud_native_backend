version: '3.8'

services:
  # =========================================================================
  # ZOOKEEPER ENSEMBLE (3 NODOS EN QUORUM - EP5 / EP6)
  # Tolerancia a caida de 1 nodo (Quorum: (3/2)+1 = 2 nodos activos requeridos)
  # =========================================================================

  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: pedidos360-zookeeper-1
    hostname: zookeeper-1
    networks:
      - kafka-cluster-net
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
    volumes:
      - zk1_data:/var/lib/zookeeper/data
      - zk1_log:/var/lib/zookeeper/log

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: pedidos360-zookeeper-2
    hostname: zookeeper-2
    networks:
      - kafka-cluster-net
    ports:
      - "2182:2182"
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2182
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
    volumes:
      - zk2_data:/var/lib/zookeeper/data
      - zk2_log:/var/lib/zookeeper/log

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: pedidos360-zookeeper-3
    hostname: zookeeper-3
    networks:
      - kafka-cluster-net
    ports:
      - "2183:2183"
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2183
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
    volumes:
      - zk3_data:/var/lib/zookeeper/data
      - zk3_log:/var/lib/zookeeper/log

  # =========================================================================
  # KAFKA BROKERS CLUSTER (3 BROKERS - ALTA DISPONIBILIDAD Y TOLERANCIA A FALLOS)
  # Factor de Replicacion = 3, Min In-Sync Replicas (ISR) = 2
  # =========================================================================

  kafka-1:
    image: confluentinc/cp-kafka:7.5.3
    container_name: pedidos360-kafka-1
    hostname: kafka-1
    networks:
      - kafka-cluster-net
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper-1:2181,zookeeper-2:2182,zookeeper-3:2183"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka-2:
    image: confluentinc/cp-kafka:7.5.3
    container_name: pedidos360-kafka-2
    hostname: kafka-2
    networks:
      - kafka-cluster-net
    ports:
      - "9093:9093"
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper-1:2181,zookeeper-2:2182,zookeeper-3:2183"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka-3:
    image: confluentinc/cp-kafka:7.5.3
    container_name: pedidos360-kafka-3
    hostname: kafka-3
    networks:
      - kafka-cluster-net
    ports:
      - "9094:9094"
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper-1:2181,zookeeper-2:2182,zookeeper-3:2183"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka3_data:/var/lib/kafka/data

  # =========================================================================
  # KAFKA-UI (ADMINISTRACION Y MONITOREO DE BROKERS, TOPICOS, OFFSETS Y LAG)
  # Acceso web: http://localhost:8085
  # =========================================================================

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pedidos360-kafka-ui
    networks:
      - kafka-cluster-net
    ports:
      - "8085:8080"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2182,zookeeper-3:2183
      DYNAMIC_CONFIG_ENABLED: 'true'

  # =========================================================================
  # BACKEND SPRING BOOT (API REST + KAFKA + RABBITMQ + JWT RESOURCE SERVER)
  # Acceso: http://localhost:8080
  # =========================================================================

  backend:
    build: .
    container_name: pedidos360-backend
    hostname: backend
    networks:
      - kafka-cluster-net
    ports:
      - "8080:8080"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: h2
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:29092,kafka-2:29093,kafka-3:29094"
      SPRING_RABBITMQ_HOST: host.docker.internal
      SPRING_RABBITMQ_PORT: 5672
      CORS_ALLOWED_ORIGINS: "http://localhost:4200"
      AZURE_TENANT_ID: "4531cbe0-83c7-406d-a972-e6302b1fb7d1"
      AZURE_API_CLIENT_ID: "3609dffc-ca49-4133-a6e5-2dbf3ba2a120"
      AZURE_API_APP_ID_URI: "api://3609dffc-ca49-4133-a6e5-2dbf3ba2a120"

  # =========================================================================
  # AUTO-INIT DE LOS 2 TOPICOS REQUERIDOS (3 PARTICIONES, 3 REPLICAS)
  # =========================================================================

  init-kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: pedidos360-init-kafka
    networks:
      - kafka-cluster-net
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "cub kafka-ready -b kafka-1:29092 1 40 &&
       cub kafka-ready -b kafka-2:29093 1 40 &&
       cub kafka-ready -b kafka-3:29094 1 40 &&
       kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic tcg.analytics.stream --partitions 3 --replication-factor 3 --config retention.ms=86400000 --config cleanup.policy=delete --config min.insync.replicas=2 &&
       kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic tcg.audit.stream --partitions 3 --replication-factor 3 --config retention.ms=604800000 --config cleanup.policy=compact,delete --config min.insync.replicas=2 &&
       echo '=== TOPICOS CREADOS EXITOSAMENTE ===' &&
       kafka-topics --bootstrap-server kafka-1:29092 --describe"

networks:
  kafka-cluster-net:
    driver: bridge

volumes:
  zk1_data:
  zk1_log:
  zk2_data:
  zk2_log:
  zk3_data:
  zk3_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:
